integration:
  system:
    name: SpajaNik Combined System
    repositories:
      - name: SpajaNikOpenEvolution
        role: core-platform
        url: https://github.com/spaja86/SpajaNikOpenEvolution
        local_path: ./platform
        capabilities:
          - domain-state
          - shared-core
      - name: example-frontend
        role: frontend-input
        url: https://github.com/spaja86/example-frontend
        local_path: <SET_FRONTEND_PATH>
        capabilities:
          - ui-input-events
          - accessibility
      - name: example-service
        role: api-and-event-contracts
        url: https://github.com/spaja86/example-service
        local_path: <SET_SERVICE_PATH>
        capabilities:
          - api-contracts
          - integration-events
